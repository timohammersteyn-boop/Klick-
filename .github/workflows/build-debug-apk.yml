name: Android CI - Build Debug APK & Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK & Create ZIP Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions for Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK & Distribution Package
        run: ./gradlew :app:createDebugZip --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchwungLive-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Distribution ZIP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchwungLive-Debug-Distribution-ZIP
          path: app/build/distributions/SchwungLive-Debug-Build.zip
          retention-days: 14
